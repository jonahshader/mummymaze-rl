[project]
name = "mummymaze-rl"
version = "0.1.0"
description = "PopCap's Mummy Maze Deluxe as a JAX RL testbed"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.9",
    "diffrax>=0.6.0",
    "equinox>=0.13.2",
    "jax[cuda13]>=0.8.2",
    "jaxtyping>=0.3.5",
    "matplotlib>=3.10.8",
    "mummy-maze-parser",
    "mummymaze-rust",
    "optax>=0.2.6",
    "tqdm>=4.67.3",
    "typer>=0.24.1",
    "wandb>=0.25.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.13",
    "ty>=0.0.12",
    "vulture>=2.14",
]
notebooks = [
    "jupyter>=1.1",
    "ipywidgets>=8.1",
    "scikit-learn>=1.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
indent-width = 2

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "ANN", # flake8-annotations
]
ignore = [
  "E731",   # lambdas are fine for FP-style composition
  "F722",   # jaxtyping dimension strings look like syntax errors
  "F821",   # jaxtyping dimension names look like undefined variables
  "ANN401", # Any is needed for dtype parameters (no good JAX dtype type)
]

[tool.ruff.lint.per-file-ignores]
# Notebooks are exploratory: no annotation, line-length or one-statement rules.
"notebooks/*" = ["ANN", "E501", "E701", "E702", "E741"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
suppress-none-returning = true

[tool.ruff.format]
indent-style = "space"
# Notebooks keep their own 4-space style; formatting them rewrites every cell.
exclude = ["*.ipynb"]

[tool.ty.src]
# Notebooks need the optional `notebooks` dependency group and aren't typed.
exclude = ["notebooks"]

[tool.ty.rules]
# Upgrade warnings to errors for strict mode
ambiguous-protocol-member = "error"
deprecated = "error"
ignore-comment-unknown-rule = "error"
invalid-ignore-comment = "error"
possibly-missing-attribute = "error"
possibly-missing-implicit-call = "error"
redundant-cast = "error"
# Enable rules that are off by default
division-by-zero = "error"
possibly-unresolved-reference = "error"

[tool.vulture]
# Everything that can use src/, so a function only an experiment calls is not "unused".
paths = ["src", "experiments", "tests", "config"]
min_confidence = 60
ignore_names = [
  # Reached through the @register_model registry, by name from a config.
  "MazeResNet",
  "MazeResNetAttn",
  # Stop-condition combinators offered to config files.
  "stop_at_step",
  "all_of",
  # Shape fields of PaddedSkeletonBatch.
  "max_edges",
  "max_win_edges",
  # ModelServer's own stop path; the WebSocket server uses its own events (docs/TODO.md).
  "stop_train",
]

[tool.uv.sources]
mummy-maze-parser = { git = "https://github.com/jonahshader/mummy-maze-parser" }
mummymaze-rust = { path = "crates/mummymaze", editable = true }
